on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ""
      SERVER_DOMAIN: ""
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm expo customize tsconfig.json # this is to generate expo-env.d.ts
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm db:check
      - run: pnpm build
  deploy:
    runs-on: ubuntu-latest
    needs: check
    env:
      DEPLOYMENT: ${{ github.event_name == 'pull_request' && format('wildlog-pr-{0}', github.event.pull_request.number) || 'wildlog' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment name
        run: |
          test -n "$DEPLOYMENT"
          if [ "$DEPLOYMENT" = "wildlog" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            exit 1
          fi
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Create Docker SSH context
        run: docker context create deploy --docker "host=ssh://${{ secrets.SERVER_USER }}@${{ secrets.SERVER_DOMAIN }}"
      - name: Build and start services
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          docker --context deploy compose build
          docker --context deploy compose -p "$DEPLOYMENT" up -d
