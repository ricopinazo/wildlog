on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ""
      SERVER_DOMAIN: ""
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm expo customize tsconfig.json # this is to generate expo-env.d.ts
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm tsc
      - run: pnpm db:check
      - run: pnpm build
  build_images:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: read
      packages: write
    env:
      COMMIT_SHA: ${{ github.sha }}
      BETTER_AUTH_SECRET: ""
      SERVER_DOMAIN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          push: true
  deployment_name:
    runs-on: ubuntu-latest
    outputs:
      deployment: ${{ steps.name.outputs.deployment }}
    steps:
      - id: name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "deployment=wildlog-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "deployment=wildlog" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    runs-on: ubuntu-latest
    needs: [check, build_images, deployment_name]
    env:
      DEPLOYMENT: ${{ needs.deployment_name.outputs.deployment }}
      COMMIT_SHA: ${{ github.sha }}
    environment:
      name: ${{ needs.deployment_name.outputs.deployment }}
      url: ${{ format('https://{0}.{1}', needs.deployment_name.outputs.deployment, vars.SERVER_DOMAIN) }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment name
        run: |
          test -n "$DEPLOYMENT"
          if [ "$DEPLOYMENT" = "wildlog" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            exit 1
          fi
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Accept new SSH host keys
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf 'Host *\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Create Docker SSH context
        run: docker context create deploy --docker "host=ssh://${{ secrets.SERVER_USER }}@${{ vars.SERVER_DOMAIN }}"
      - name: Start services
        env:
          SERVER_DOMAIN: ${{ vars.SERVER_DOMAIN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          docker --context deploy compose -p "$DEPLOYMENT" up -d
